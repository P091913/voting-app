<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #5C1D29;
            overflow: hidden;
        }

        .navbar a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
        }

        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }

        @media screen and (max-width: 600px) {
            .navbar a {
                float: none;
                width: 100%;
                text-align: left;
            }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <H1>Admin Page</H1>
        <a href="#">Sign Up</a>
        <a href="#">Login</a>
        <a href="#">Bits</a>
        <a href="#">Bytes</a>
        <a href="#">Pins</a>
        <a href="#">Companies</a>
        <a href="#">School Rep</a>
        <a href="#">Results</a>
        <a href="#">Settings</a>
    </div>

    <div>
        <h1>Test</h1>
        <p>Test</p>
    </div>

</body>
</html>
